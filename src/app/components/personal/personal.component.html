<div class="card p-3 mb-4 shadow-sm card-terminal" *hasRole="'ROOT'">
  <h4 class="text-primary">{{ modoEdicion ? 'Editar Personal' : 'Registrar Personal de Vuelo' }}</h4>
  <div class="row g-2">
    <div class="col-12 col-md-3">
      <label class="form-label fw-bold">Nombre</label>
      <input type="text" [(ngModel)]="nombre" placeholder="Nombre" class="form-control">
    </div>
    <div class="col-12 col-md-3">
      <label class="form-label fw-bold">Apellido</label>
      <input type="text" [(ngModel)]="apellido" placeholder="Apellido" class="form-control">
    </div>
    <div class="col-12 col-md-2">
      <label class="form-label fw-bold">DNI</label>
      <input type="text" [(ngModel)]="dni" placeholder="DNI" class="form-control">
    </div>
    <div class="col-12 col-md-2">
      <label class="form-label fw-bold">Sueldo ($)</label>
      <input type="number" [(ngModel)]="sueldo" placeholder="Sueldo" class="form-control">
    </div>
    <div class="col-12 col-md-2">
      <label class="form-label fw-bold">Cargo / Rango</label>
      <select [(ngModel)]="tipo" class="form-select">
        <option value="PILOTO">PILOTO</option>
        <option value="AZAFATA">AZAFATA</option>
      </select>
    </div>
  </div>
  <div class="mt-3 d-flex flex-wrap gap-2">
    <button (click)="guardarPersonal()" class="btn btn-primary">{{ modoEdicion ? 'Guardar Cambios' : 'Registrar Personal' }}</button>
    <button *ngIf="modoEdicion" (click)="limpiarFormulario()" class="btn btn-secondary">Cancelar</button>
  </div>
</div>

<div class="card p-3 shadow-sm card-terminal">
  <div class="d-flex justify-content-between align-items-center mb-2">
    <h4 class="mb-0">Personal Registrado</h4>
    <button class="btn btn-sm btn-outline-primary" (click)="cargarPersonal()">Actualizar Lista</button>
  </div>
  <div class="table-responsive" *ngIf="personalList.length > 0">
    <table class="table table-striped align-middle mt-2 mb-0">
      <thead class="table-dark">
        <tr>
          <th>ID</th>
          <th>Nombre Completo</th>
          <th>DNI</th>
          <th class="text-center">Sueldo</th>
          <th class="text-center">Cargo / Rango</th>
          <th class="text-center" *hasRole="'ROOT'">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let p of personalList">
          <td>{{ p.id }}</td>
          <td class="fw-bold">{{ p.nombre }} {{ p.apellido }}</td>
          <td>{{ p.dni }}</td>
          <td class="text-center">${{ p.sueldo }}</td>
          <td class="text-center">
            <span class="badge" [ngClass]="p.tipo === 'PILOTO' ? 'bg-primary' : 'bg-info text-dark'">
              {{ p.tipo }}
            </span>
          </td>
          <td class="text-center" *hasRole="'ROOT'">
            <div class="d-flex justify-content-center gap-1">
              <button (click)="seleccionarParaEditar(p)" class="btn btn-warning btn-sm">Editar</button>
              <button (click)="eliminarPersonal(p.id)" class="btn btn-danger btn-sm">Eliminar</button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
  <div *ngIf="personalList.length === 0" class="alert alert-info text-center mt-2 mb-0">Sin personal registrado en el sistema.</div>
</div>
